[package]
name = "sinksight-library-hash"
version = "0.1.3"
edition = "2021"
description = "AST-based JavaScript library fingerprinting (slh1 hashes)."
license-file = "../../LICENSE"
repository = "https://github.com/crazycat256/sinksight-library-hash"
homepage = "https://github.com/crazycat256/sinksight-library-hash"
documentation = "https://docs.rs/sinksight-library-hash"
readme = "../../README.md"

[[bin]]
name = "slh"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_span = "0.151.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

[features]
debug-ir = []
