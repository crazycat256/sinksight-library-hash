[package]
name = "sinksight-library-hash-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for sinksight-library-hash."
license = "GPL-3.0"

[lib]
name = "sinksight_library_hash"
crate-type = ["cdylib"]

[dependencies]
sinksight-library-hash = { path = "../core" }
js-sys = "0.3.92"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"

[features]
debug-ir = ["sinksight-library-hash/debug-ir"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

