name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Rust tests
        run: cargo test

      - name: Build WASM
        run: wasm-pack build crates/wasm --target nodejs

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: JS tests
        run: npm test

      - name: Build napi
        run: cd crates/napi && npm ci && npm run build
