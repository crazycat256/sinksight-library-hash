[package]
name = "sinksight-library-hash"
version = "0.1.0"
edition = "2021"
description = "AST-based JavaScript library fingerprinting (slh1 hashes), usable as a Rust crate or compiled to WebAssembly."
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "0.110.0"
oxc_ast = "0.110.0"
oxc_parser = "0.110.0"
oxc_semantic = "0.110.0"
oxc_span = "0.110.0"
oxc_syntax = "0.110.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

# WASM/JS bindings — compiled automatically when targeting wasm32
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.92"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[features]
debug-ir = []

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
